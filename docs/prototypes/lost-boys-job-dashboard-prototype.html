<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interactive Lost Boys Demolition Job Dashboard concept using fictitious data.">
  <title>Lost Boys Demolition — Job Dashboard Prototype</title>
  <style>
    :root {
      --ink: #192534;
      --ink-soft: #2b3949;
      --muted: #697585;
      --muted-light: #98a2ae;
      --surface: #ffffff;
      --canvas: #edf0f3;

      --warning: #9f6700;

      --danger: #b63831;

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-width: 320px; background: var(--canvas); color: var(--ink); font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }
    .app-shell { min-height: 100vh; }

    .brand-lockup { display: flex; align-items: center; gap: 10px; min-width: max-content; border: 0; background: transparent; cursor: pointer; padding: 0; }

    .brand-name { font-size: 13px; font-weight: 850; }
    .desktop-nav { display: flex; gap: 5px; margin-left: 24px; }

    .avatar { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: #f0b541; color: var(--ink); font-size: 11px; font-weight: 900; }

    .metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }

    .metric-label { display: block; color: #adb8c5; font-size: 11px; }
    .metric-value { display: block; margin-top: 8px; font-size: clamp(22px, 2.4vw, 31px); font-weight: 850; letter-spacing: -.045em; font-variant-numeric: tabular-nums; }

    .workspace-body { padding: 22px; background: var(--canvas-warm); }
    .page-heading { display: flex; align-items: flex-end; gap: 14px; margin-bottom: 17px; }

    .button:hover { background: #f8f9fb; }

    .stage-tab { display: flex; align-items: center; gap: 7px; border: 1px solid var(--line); border-radius: 10px; background: white; padding: 11px 12px; cursor: pointer; color: var(--muted); font-size: 11px; font-weight: 800; }
    .stage-tab strong { margin-left: auto; border-radius: 999px; background: var(--canvas); padding: 3px 7px; color: var(--ink); font-size: 9px; }

    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .toast { position: fixed; right: 18px; bottom: 18px; z-index: 100; max-width: 360px; border-radius: 11px; background: var(--ink); color: white; padding: 12px 14px; box-shadow: var(--shadow); font-size: 11px; font-weight: 750; animation: toast-in .2s ease-out; }

    .mobile-bottom-nav { display: none; }

    @media (max-width: 900px) {
      .metric-grid, .stage-grid { grid-template-columns: 1fr 1fr; }
      .dashboard-columns { grid-template-columns: 1fr; }

      .page-container { padding-bottom: 88px; }
      .mobile-bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; display: grid; grid-template-columns: repeat(4, 1fr); min-height: 62px; border-top: 1px solid var(--line); background: rgba(255,255,255,.97); backdrop-filter: blur(12px); }

      .app-header { height: 60px; padding: 0 14px; }

      .period-select { width: 100%; min-width: 0; margin-left: 0; padding: 8px 27px 8px 9px; font-size: 10px; }

      .stage-icon { width: 26px; height: 26px; }

      .attention-row { grid-template-columns: 8px 1fr auto; padding: 12px; }
      .row-action { display: none; }
      .workspace-body { padding: 14px 12px; }
      .page-heading { align-items: center; }

      .page-heading p { font-size: 10px; }
      .page-actions .button:first-child { display: none; }
      .stage-tabs { display: flex; overflow-x: auto; padding-bottom: 3px; }
      .stage-tab { flex: 1 0 auto; min-width: 104px; padding: 9px 10px; }

      .search-control { max-width: none; flex-basis: 100%; }
      .filter-select { flex: 1; min-width: 0; }

      .desktop-table { display: none; }
      .mobile-cards { display: grid; }

      // Ratified Lost Boys rate model. Labor and allocated overhead are BOTH derived from the
      // same productive-hour count, so overhead can never drift away from labor.
      const RATES = Object.freeze({
        laborPerHour: 26,
        overheadPerHour: 23,
        ccFeeRate: 0.035,
        dumpChargePerLoad: 300,
        hoursPerCrewDay: 40
      });

      const nonLabor = (materials, rentals, dumpFees, subcontractors, other) => ({
        materials, rentals, dumpFees, subcontractors, other
      });

      const NO_COSTS = nonLabor(0, 0, 0, 0, 0);

      // A financial column. `hours` drives labor and overhead; fees are 3.5% of recognised revenue.
      // `started: false` marks a job that has not begun, so its actual column is a true zero
      // rather than a revenue-minus-nothing figure that reads as profit.
      const column = (approvedRevenue, approvedChangeOrderRevenue, hours, costs, options = {}) => {
        const started = options.started !== false;
        const totalRevenue = approvedRevenue + approvedChangeOrderRevenue;
        return {
          approvedRevenue,
          approvedChangeOrderRevenue,
          productiveHours: hours,
          started,
          directCosts: {
            labor: Math.round(hours * RATES.laborPerHour),
            materials: costs.materials,
            rentals: costs.rentals,
            dumpFees: costs.dumpFees,
            subcontractors: costs.subcontractors,
            other: costs.other
          },
          overhead: Math.round(hours * RATES.overheadPerHour),
          processingFees: started ? Math.round(totalRevenue * RATES.ccFeeRate) : 0
        };
      };

        const directCosts = {
          labor,
          materials: costs.materials,
          rentals: costs.rentals,
          dumpFees: costs.dumpFees,
          subcontractors: costs.subcontractors,
          other: costs.other
        };
        const totalDirectCosts = labor + costs.materials + costs.rentals
          + costs.dumpFees + costs.subcontractors + costs.other;
        const grossProfit = revenue - totalDirectCosts;
        const jobProfit = grossProfit - overhead - processingFees;
        return {
          revenue,
          productiveHours: hours,
          directCosts,
          totalDirectCosts,
          grossProfit,
          overhead,

  <script id="prototype-model">
    window.JobDashboardModel = (() => {
      const sum = (values) => values.reduce((total, value) => total + (Number(value) || 0), 0);
      const money = (value) => new Intl.NumberFormat('en-US', {
        style: 'currency', currency: 'USD', maximumFractionDigits: 0
      }).format(value);
      const percent = (value) => new Intl.NumberFormat('en-US', {
        style: 'percent', maximumFractionDigits: 1
      }).format(value);

      function getPnl(record, columnName) {
        const financial = record.financials[columnName];
        const approvedRevenue = financial.approvedRevenue;
        const changeOrderRevenue = financial.approvedChangeOrderRevenue;
        const totalRevenue = approvedRevenue + changeOrderRevenue;
        const totalDirectCosts = sum(Object.values(financial.directCosts));
        const grossProfit = totalRevenue - totalDirectCosts;
        const jobProfit = grossProfit - financial.overhead - financial.processingFees;
        return {
          approvedRevenue,
          changeOrderRevenue,
          totalRevenue,
          directCosts: financial.directCosts,
          totalDirectCosts,
          grossProfit,
          overhead: financial.overhead,
          processingFees: financial.processingFees,
          jobProfit,
          jobProfitMargin: totalRevenue ? jobProfit / totalRevenue : 0
        };
      }

      function getHealth(record) {
        if (record.kind !== 'job' || record.stageGroup !== 'in-progress') return record.health;
        const current = getPnl(record, 'current').jobProfit;
        const forecast = getPnl(record, 'forecast').jobProfit;
        const retention = current ? forecast / current : 0;
        if (forecast < 0 || retention < 0.75) return { label: 'At Risk', tone: 'risk', retention };
        if (retention < 0.9 || record.confidence !== 'High' || record.dataFreshness !== 'Fresh') {
          return { label: 'Watch', tone: 'watch', retention };
        }
        return { label: 'On Track', tone: 'track', retention };
      }

      const getStageGroup = (record) => record.stageGroup;
      const getStageRecords = (records, group) => records.filter((record) => getStageGroup(record) === group);

      function searchRecords(records, query) {
        const needle = query.trim().toLowerCase();
        if (!needle) return records;
        return records.filter((record) => [record.id, record.name, record.client, record.company, record.address]
          .join(' ').toLowerCase().includes(needle));
      }

      const isOpenEstimate = (record) => record.stageGroup === 'estimates' && !record.closedLost;

      // How much of the current approved cost budget has actually posted. Compared against the
      // foreman's reported completion, this is the honest mid-job burn signal — it replaces the
      // "actual profit" figure, which before completion only measures how far the paperwork has got.
      function getCostCompletion(record) {
        if (record.kind !== 'job' || record.financials.actual.started === false) return null;
        const totalCost = (column) => {
          const pnl = getPnl(record, column);
          return pnl.totalDirectCosts + pnl.overhead + pnl.processingFees;
        };
        const posted = totalCost('actual');
        const budget = totalCost('current');
        if (!budget) return null;
        return { posted, budget, pct: posted / budget };
      }

      function getPeriodMetrics(records, period) {
        const included = records.filter((record) => record.periods.includes(period));
        const official = included.filter((record) => record.kind === 'job');
        const estimates = included.filter(isOpenEstimate);
        return {
          approvedRevenue: sum(official.map((record) => getPnl(record, 'current').approvedRevenue)),
          changeOrderRevenue: sum(official.map((record) => getPnl(record, 'current').changeOrderRevenue)),
          totalRevenue: sum(official.map((record) => getPnl(record, 'current').totalRevenue)),
          forecastJobProfit: sum(official.map((record) => getPnl(record, 'forecast').jobProfit)),
          actualCommittedCosts: sum(official.map((record) => {
            const pnl = getPnl(record, 'actual');
            return pnl.totalDirectCosts + pnl.overhead + pnl.processingFees;
          })),
          openEstimateValue: sum(estimates.map((record) => record.estimateValue))
        };
      }

      return {
        money, percent, getPnl, getHealth, getStageGroup, getStageRecords, searchRecords, getPeriodMetrics, isOpenEstimate, getCostCompletion
      };
    })();
  </script>

      function renderPnl(record) {

        // The Actual + Committed column recognises revenue in full the moment a job is approved,

        const actualCaveat = (column) => {

          return `<tr class="${key === 'labor' ? '' : 'cost-detail'}"><td class="indent">${label}</td>${columns.map((column) => `<td>${formatCost(pnls[column].directCosts[key])}</td>`).join('')}<td class="${tone}">${formatVariance(variance, true)}</td></tr>`;
        }).join('');
        const totalDirectVariance = pnls.forecast.totalDirectCosts - pnls.current.totalDirectCosts;
        const grossVariance = pnls.forecast.grossProfit - pnls.current.grossProfit;
        const overheadVariance = pnls.forecast.overhead - pnls.current.overhead;
        const processingVariance = pnls.forecast.processingFees - pnls.current.processingFees;
        const profitVariance = pnls.forecast.jobProfit - pnls.current.jobProfit;
        const marginVariance = pnls.forecast.jobProfitMargin - pnls.current.jobProfitMargin;

        return `
          <section class="pnl-panel" aria-labelledby="pnl-heading">
            <div class="pnl-header"><h2 id="pnl-heading">Job Profit &amp; Loss Comparison</h2><span>Current approved budget and live forecast</span></div>
            <div class="pnl-scroll">
              <table class="pnl-table ${state.expandedCosts ? 'show-costs' : ''}">
                <thead><tr><th scope="col">Revenue / Cost</th><th scope="col">Original Estimate</th><th scope="col">Current Approved</th><th scope="col">Actual + Committed</th><th scope="col">Forecast at Completion</th><th scope="col">Forecast Variance</th></tr></thead>
                <tbody>
                  <tr class="section-row"><td colspan="6">Revenue</td></tr>
                  <tr><td class="indent">Approved Revenue</td>${revenueCells('approvedRevenue')}<td>—</td></tr>
                  <tr><td class="indent">Approved Change Order Revenue</td>${revenueCells('changeOrderRevenue')}<td>—</td></tr>
                  <tr class="subtotal"><td>Total Revenue</td>${revenueCells('totalRevenue')}<td>—</td></tr>
                  <tr class="section-row"><td colspan="6">Direct Costs</td></tr>
                  ${directRows}
                  <tr class="subtotal"><td>Total Direct Costs</td>${costCells('totalDirectCosts')}<td class="${totalDirectVariance > 0 ? 'unfavorable' : totalDirectVariance < 0 ? 'favorable' : ''}">${formatVariance(totalDirectVariance, true)}</td></tr>
                  <tr class="gross-profit"><td>Gross Profit</td>${profitCells('grossProfit')}<td class="${grossVariance < 0 ? 'unfavorable' : grossVariance > 0 ? 'favorable' : ''}">${formatVariance(grossVariance)}</td></tr>
                  <tr><td>Overhead Allocation</td>${costCells('overhead')}<td class="${overheadVariance > 0 ? 'unfavorable' : overheadVariance < 0 ? 'favorable' : ''}">${formatVariance(overheadVariance, true)}</td></tr>
                  <tr><td>Processing Fees</td>${costCells('processingFees')}<td class="${processingVariance > 0 ? 'unfavorable' : processingVariance < 0 ? 'favorable' : ''}">${formatVariance(processingVariance, true)}</td></tr>
                  <tr class="job-profit"><td>Job Profit</td>${profitCells('jobProfit')}<td class="${profitVariance < 0 ? 'unfavorable' : profitVariance > 0 ? 'favorable' : ''}">${formatVariance(profitVariance)}</td></tr>
                  <tr class="job-margin"><td>Job Profit Margin</td>${columns.map((column) => `<td>${actualCaveat(column) ? `<span class="not-available">${actualCaveat(column)}</span>` : model.percent(pnls[column].jobProfitMargin)}</td>`).join('')}<td class="${marginVariance < 0 ? 'unfavorable' : marginVariance > 0 ? 'favorable' : ''}">${marginVariance ? `${marginVariance > 0 ? '+' : '−'}${Math.abs(marginVariance * 100).toFixed(1)} pts` : '—'}</td></tr>
                </tbody>
              </table>
            </div>
            <button class="button mobile-cost-toggle" data-toggle-costs>${state.expandedCosts ? 'Hide direct-cost detail' : 'Show all direct costs'}</button>
            <p class="pnl-note">For revenue, Actual + Committed means contractually approved revenue. For costs, it means posted actual costs plus recorded commitments. Pending changes remain outside Total Revenue. ${record.stageGroup === 'in-progress' ? 'Job profit is not shown in that column until the job is operationally complete — revenue is approved in full up front while costs are still posting, so the subtraction would overstate profit. Use Forecast at Completion, and the cost-posted figure alongside, while work is live.' : ''}</p>
          </section>`;
      }

      const detailTabs = (tabs) => `<nav class="detail-tabs" aria-label="Record detail sections">${tabs.map(([id, label]) => `<button class="detail-tab ${state.detailTab === id ? 'active' : ''}" data-detail-tab="${id}">${label}</button>`).join('')}</nav>`;

      const renderActivity = (record) => `
        <section class="detail-list-panel"><div class="detail-list-header"><h2>Activity History</h2><button class="button" data-modal="activity">Open Audit Preview</button></div><ol class="detail-list">${record.activity.map((item, index) => `<li><span><strong>${escapeHtml(item)}</strong><span>Recorded in the prototype audit history.</span></span><time>Event ${index + 1}</time></li>`).join('')}</ol></section>`;

      function renderEstimateDetail(record) {
        const financial = record.estimateFinancial;
        const tabs = [['overview', 'Overview'], ['financials', 'Financials'], ['activity', 'Activity']];
        let tabContent;
        if (state.detailTab === 'activity') tabContent = renderActivity(record);
        else {
          const breakdownRows = Object.entries({
            labor: 'Labor', materials: 'Materials', rentals: 'Rentals', dumpFees: 'Dump Fees', subcontractors: 'Subcontractors', other: 'Other Direct Costs'
          }).map(([key, label]) => `<tr><td>${label}</td><td>${formatCost(financial.directCosts[key])}</td></tr>`).join('');
          tabContent = `
            <section class="estimate-summary">
              <article class="summary-card"><label>Estimate Value</label><strong>${model.money(financial.revenue)}</strong><small>Pre-job opportunity value</small></article>
              <article class="summary-card"><label>Estimated Job Profit</label><strong>${model.money(financial.jobProfit)}</strong><small>After overhead and processing fees</small></article>
              <article class="summary-card"><label>Estimated Margin</label><strong>${model.percent(financial.jobProfitMargin)}</strong><small>Job Profit ÷ Total Revenue</small></article>
              <article class="summary-card"><label>Quote Stage</label><strong style="font-size:15px">${escapeHtml(record.stage)}</strong><small>${escapeHtml(record.age)}</small></article>
            </section>
            <section class="estimate-layout">
              <article class="detail-list-panel"><div class="detail-list-header"><h2>Estimate Information</h2><span class="status-pill neutral">Pre-job estimate</span></div><div class="info-grid"><div class="info-cell"><label>Client</label><strong>${escapeHtml(record.client)}</strong></div><div class="info-cell"><label>Estimator</label><strong>${escapeHtml(record.estimator)}</strong></div><div class="info-cell"><label>Job Site</label><strong>${escapeHtml(record.address)}</strong></div><div class="info-cell"><label>Labor Assumption</label><strong>${escapeHtml(record.laborAssumption)}</strong></div><div class="info-cell" style="grid-column:1/-1;border-right:0"><label>Scope</label><strong>${escapeHtml(record.scope)}</strong></div><div class="info-cell"><label>Last Activity</label><strong>${escapeHtml(record.lastActivity)}</strong></div><div class="info-cell"><label>Next Action</label><strong>${escapeHtml(record.nextAction)}</strong></div></div></article>
              <article class="detail-list-panel"><div class="detail-list-header"><h2>Estimated Economics</h2></div><table class="cost-breakdown"><tbody><tr><td>Approved Revenue</td><td>${model.money(financial.revenue)}</td></tr>${breakdownRows}<tr class="subtotal"><td>Total Direct Costs</td><td>${formatCost(financial.totalDirectCosts)}</td></tr><tr><td>Gross Profit</td><td>${model.money(financial.grossProfit)}</td></tr><tr><td>Overhead Allocation</td><td>${formatCost(financial.overhead)}</td></tr><tr><td>Processing Fees</td><td>${formatCost(financial.processingFees)}</td></tr><tr class="subtotal"><td>Job Profit</td><td>${model.money(financial.jobProfit)}</td></tr><tr class="subtotal"><td>Job Profit Margin</td><td>${model.percent(financial.jobProfitMargin)}</td></tr></tbody></table></article>
            </section>`;
        }

        return `
          <div class="page-container"><section class="detail-shell"><div class="detail-body">
            <div class="breadcrumb"><button data-back="workspace">${stageMeta.estimates.label}</button> &nbsp;›&nbsp; ${escapeHtml(record.id)}</div>
            <div class="detail-heading"><div><p class="eyebrow">Estimate Record</p><h1>${escapeHtml(record.name)}</h1><p>${escapeHtml(record.id)} · ${escapeHtml(record.client)} · ${escapeHtml(record.address)}</p><div class="detail-status">${statusPill(record.stage, record.stage === 'Quote Accepted' ? 'track' : 'neutral')}<span class="status-pill neutral">Not yet an official job</span></div></div><div class="detail-actions"><button class="button" data-modal="estimate">Edit Estimate</button><button class="button" data-modal="activity">View History</button>${record.stage === 'Quote Accepted' ? '<button class="button primary" data-modal="schedule">Schedule Job</button>' : '<button class="button primary" data-modal="estimate">Continue Estimate</button>'}</div></div>
            ${detailTabs(tabs)}${tabContent}
          </div></section></div>`;
      }

      const listPanel = (title, items, emptyCopy, action = '') => `
        <section class="detail-list-panel"><div class="detail-list-header"><h2>${title}</h2>${action}</div>${items.length ? `<ul class="detail-list">${items.join('')}</ul>` : `<div class="empty-state"><h3>${emptyCopy}</h3><p>No entries are recorded in this demonstration.</p></div>`}</section>`;

      function renderJobDetail(record) {
        const health = model.getHealth(record);
        const current = model.getPnl(record, 'current');
        const forecast = model.getPnl(record, 'forecast');
        const forecastVariance = forecast.jobProfit - current.jobProfit;
        const retention = current.jobProfit ? forecast.jobProfit / current.jobProfit : 0;
        const tabs = [
          ['overview', 'Overview'], ['financials', 'Financials'],
          ['changes', `Change Orders · ${record.changeOrders.length}`],
          ['checklists', `Checklists · ${record.checklists.length}`], ['activity', 'Activity']
        ];
        let tabContent;

        if (state.detailTab === 'financials') tabContent = renderPnl(record);
        else if (state.detailTab === 'changes') {
          const items = record.changeOrders.map((change) => `<li><span><strong>${escapeHtml(change.id)} · ${model.money(change.amount)}</strong><span>${escapeHtml(change.approval)}${change.status !== 'Approved' ? ' · Excluded from Total Revenue' : ''}</span></span>${statusPill(change.status, change.status === 'Approved' ? 'track' : 'watch')}</li>`);
          tabContent = listPanel('Change Orders', items, 'No change orders', '<button class="button primary" data-modal="change">+ Change Order</button>');
        } else if (state.detailTab === 'checklists') {
          const items = record.checklists.map((checklist, index) => `<li><span><strong>${escapeHtml(checklist)}</strong><span>Foreman submission · progress and remaining crew-days recorded</span></span><time>Entry ${index + 1}</time></li>`);
          tabContent = listPanel('Job Checklists', items, 'No checklists yet', '<button class="button primary" data-modal="checklist">Open Checklist</button>');
        } else if (state.detailTab === 'activity') tabContent = renderActivity(record);
        else {
          tabContent = `
            <section class="summary-grid">
              <article class="health-card ${health.tone}"><span class="health-label">Job Health</span><span class="health-main"><strong>${escapeHtml(health.label)}</strong><span class="confidence-pill">${escapeHtml(record.confidence)} confidence</span></span><p>Forecast retains ${model.percent(retention)} of current approved Job Profit.</p></article>
              <article class="summary-card"><label>Forecast Job Profit</label><strong>${model.money(forecast.jobProfit)}</strong><small class="${forecastVariance < 0 ? 'unfavorable' : ''}">${forecastVariance < 0 ? '↓' : '↑'} ${model.money(Math.abs(forecastVariance))} vs current plan</small></article>
              <article class="summary-card"><label>Forecast Margin</label><strong>${model.percent(forecast.jobProfitMargin)}</strong><small>Current plan ${model.percent(current.jobProfitMargin)}</small></article>
              <article class="summary-card"><label>Total Revenue</label><strong>${model.money(current.totalRevenue)}</strong><small>${current.changeOrderRevenue ? `${model.money(current.changeOrderRevenue)} from approved changes` : 'No approved change revenue'}</small></article>
            </section>
            <section class="health-explanation ${health.tone}"><span class="explanation-icon" aria-hidden="true">${health.tone === 'track' ? '✓' : '!'}</span><span><strong>${health.tone === 'track' ? 'The current forecast supports the plan' : 'Why this job needs attention'}</strong><span>${escapeHtml(record.healthReason)}</span></span><button class="button" data-modal="activity">Review source data</button></section>
            <section class="detail-grid">${renderPnl(record)}<aside class="side-stack"><section class="side-panel"><h3>Job Progress</h3><div class="progress-body"><div class="progress-top"><span>Reported completion</span><span>${record.progress}%</span></div><div class="progress-bar"><span style="width:${record.progress}%"></span></div>${(() => {
              const cost = model.getCostCompletion(record);
              if (!cost) return '<p class="progress-note">No costs have posted yet.</p>';
              const pct = Math.round(cost.pct * 100);
              // Spending ahead of reported progress is the signal worth seeing.
              const ahead = pct - record.progress;
              const tone = ahead >= 10 ? 'unfavorable' : ahead <= -5 ? 'favorable' : '';
              return `<div class="progress-top"><span>Cost posted vs approved budget</span><span>${pct}%</span></div>
                <div class="progress-bar cost"><span class="${tone}" style="width:${Math.min(pct, 100)}%"></span></div>
                <p class="progress-note ${tone}">${model.money(cost.posted)} of ${model.money(cost.budget)} approved cost budget posted${record.stageGroup === 'in-progress'
                  ? ` · ${ahead > 0 ? `spending is ${ahead} pts ahead of reported completion` : ahead < 0 ? `spending is ${Math.abs(ahead)} pts behind reported completion` : 'spending is in line with reported completion'}`
                  : ''}.</p>`;
            })()}<div class="progress-metrics"><div class="progress-metric"><span>Crew-days used</span><strong>${record.crewDaysUsed}</strong></div><div class="progress-metric"><span>Remaining</span><strong>${record.crewDaysRemaining}</strong></div><div class="progress-metric"><span>Labor hours</span><strong>${record.laborHours}</strong></div><div class="progress-metric"><span>Data freshness</span><strong>${escapeHtml(record.dataFreshness)}</strong></div></div></div></section><section class="side-panel"><h3>Recommended Actions</h3><button class="recommended-action" data-modal="checklist"><strong>Review remaining crew-days</strong><span>Confirm progress and the foreman’s completion forecast.</span><em>Open checklist →</em></button><button class="recommended-action" data-modal="actual"><strong>Review actual and committed costs</strong><span>Confirm labor, Bill transactions, and unposted commitments.</span><em>Add actual cost →</em></button>${record.changeOrders.length ? '<button class="recommended-action" data-detail-tab="changes"><strong>Review approved change revenue</strong><span>Confirm customer and internal approval history.</span><em>View change orders →</em></button>' : '<button class="recommended-action" data-modal="change"><strong>Document a scope change</strong><span>Preview the change-order workflow.</span><em>Add change order →</em></button>'}</section></aside></section>`;
        }

        return `
          <div class="page-container"><section class="detail-shell"><div class="detail-body">
            <div class="breadcrumb"><button data-back="workspace">${stageMeta[record.stageGroup].label}</button> &nbsp;›&nbsp; ${escapeHtml(record.id)}</div>
            <div class="detail-heading"><div><p class="eyebrow">Live Job Profitability Health</p><h1>${escapeHtml(record.name)}</h1><p>${escapeHtml(record.id)} · ${escapeHtml(record.client)} · ${escapeHtml(record.address)}</p><div class="detail-status">${statusPill(record.stage, 'neutral')}<span class="status-pill neutral">${escapeHtml(record.schedule || record.completedDate || '')}</span><span class="status-pill neutral">${escapeHtml(record.crew)}</span></div></div><div class="detail-actions"><button class="button" data-modal="schedule">Edit Schedule</button><button class="button" data-modal="change">+ Change Order</button><button class="button primary" data-modal="actual">Add Actual Cost</button></div></div>
            ${detailTabs(tabs)}${tabContent}
          </div></section></div>`;
      }

      let lastFocusedElement = null;
      const modalRoot = document.getElementById('modal-root');
      const toastRoot = document.getElementById('toast-root');

      const modalContent = (type, record) => {
        const common = {
          schedule: ['Edit Schedule', `<div class="field"><label for="start-date">Start date</label><input id="start-date" type="date" value="2026-08-20"></div><div class="field"><label for="end-date">Completion date</label><input id="end-date" type="date" value="2026-08-21"></div><div class="field full"><label for="crew">Assigned crew</label><select id="crew"><option>Crew 1 · Nick</option><option>Crew 2 · Alex</option><option>Crew 3 · Brady</option><option>Crew 4 · Cade</option></select></div>`],
          actual: ['Add Actual Cost', `<div class="field"><label for="cost-category">Cost category</label><select id="cost-category"><option>Labor</option><option>Materials</option><option>Rentals</option><option>Dump Fees</option><option>Subcontractors</option><option>Other Direct Costs</option></select></div><div class="field"><label for="cost-amount">Amount</label><input id="cost-amount" type="number" min="0" step=".01" value="680"></div><div class="field full"><label for="cost-note">Source or note</label><textarea id="cost-note">Unposted commitment for demonstration</textarea></div>`],
          change: ['Add Change Order', `<div class="field full"><label for="change-description">Scope change</label><textarea id="change-description">Additional removal requested in the field.</textarea></div><div class="field"><label for="change-revenue">Approved revenue</label><input id="change-revenue" type="number" min="0" value="1500"></div><div class="field"><label for="change-cost">Budgeted cost</label><input id="change-cost" type="number" min="0" value="900"></div><div class="field"><label for="customer-approval">Customer approval</label><select id="customer-approval"><option>Written</option><option>Verbal — documented</option><option>Pending</option></select></div><div class="field"><label for="internal-approval">Internal approval</label><select id="internal-approval"><option>Dane — approved</option><option>Pending Dane review</option></select></div>`],
          checklist: ['Job Checklist', `<div class="field"><label for="progress">Job completion</label><input id="progress" type="number" min="0" max="100" value="${record.progress || 0}"></div><div class="field"><label for="remaining-days">Crew-days remaining</label><input id="remaining-days" type="number" min="0" step=".5" value="${record.crewDaysRemaining || 0}"></div><div class="field full"><label for="checklist-note">Foreman notes</label><textarea id="checklist-note">Progress and remaining work entered for demonstration.</textarea></div>`],
          estimate: ['Estimate Preview', `<div class="field"><label for="estimate-stage">Estimate stage</label><select id="estimate-stage"><option>${escapeHtml(record.stage)}</option><option>Quote Sent</option><option>Quote Accepted</option></select></div><div class="field"><label for="estimate-value">Estimate value</label><input id="estimate-value" type="number" min="0" value="${record.estimateValue || 0}"></div><div class="field full"><label for="estimate-note">Estimator note</label><textarea id="estimate-note">${escapeHtml(record.nextAction || '')}</textarea></div>`],
          activity: ['Audit & Activity Preview', `<div class="field full"><label>Recorded history</label><div class="detail-list-panel"><ul class="detail-list">${(record.activity || []).map((item, index) => `<li><span><strong>${escapeHtml(item)}</strong><span>Immutable demo event ${index + 1}</span></span></li>`).join('')}</ul></div></div>`]
        };
        return common[type] || common.activity;
      };

      function openModal(type, record = recordById(state.selectedId)) {
        if (!record) return;
        lastFocusedElement = document.activeElement;
        state.modal = type;
        const [title, fields] = modalContent(type, record);
        modalRoot.innerHTML = `
          <div class="modal-backdrop" data-modal-backdrop>
            <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
              <header class="modal-header"><h2 id="modal-title">${title}</h2><button class="modal-close" data-modal-close aria-label="Close preview">×</button></header>
              <form data-preview-form><div class="modal-body"><div class="prototype-notice">Prototype only — this information will not be permanently saved.</div><div class="form-grid">${fields}</div><div class="modal-actions"><button class="button" type="button" data-modal-close>Cancel</button><button class="button primary" type="submit">Preview Submit</button></div></div></form>
            </section>
          </div>`;
        requestAnimationFrame(() => modalRoot.querySelector('input, select, textarea, button')?.focus());
      }

      function closeModal() {
        state.modal = null;
        modalRoot.innerHTML = '';
        if (lastFocusedElement instanceof HTMLElement) lastFocusedElement.focus();
      }

      function showToast(message) {
        toastRoot.innerHTML = `<div class="toast">${escapeHtml(message)}</div>`;
        window.setTimeout(() => { toastRoot.innerHTML = ''; }, 3200);
      }

      function render() {
        let content;
        if (state.screen === 'dashboard') content = renderDashboard();
        else if (state.screen === 'workspace') content = renderStageWorkspace();
        else {
          const record = recordById(state.selectedId);
          content = record?.kind === 'estimate' ? renderEstimateDetail(record) : renderJobDetail(record);
        }
        app.innerHTML = `<div class="app-shell">${appHeader()}${content}${mobileNav()}</div>`;
      }

      document.addEventListener('click', (event) => {
        const modalClose = event.target.closest('[data-modal-close]');
        if (modalClose) {
          closeModal();
          return;
        }
        if (event.target.matches('[data-modal-backdrop]')) {
          closeModal();
          return;
        }
        const modal = event.target.closest('[data-modal]');
        if (modal) {
          openModal(modal.dataset.modal);
          return;
        }
        const detailTab = event.target.closest('[data-detail-tab]');
        if (detailTab) {
          state.detailTab = detailTab.dataset.detailTab;
          render();
          return;
        }
        const costToggle = event.target.closest('[data-toggle-costs]');
        if (costToggle) {
          state.expandedCosts = !state.expandedCosts;
          render();
          return;
        }
        const stage = event.target.closest('[data-stage]');
        if (stage) {
          navigate('workspace', { stage: stage.dataset.stage, query: '', healthFilter: 'all' });
          return;
        }
        const record = event.target.closest('[data-record-id]');
        if (record) {
          const selected = recordById(record.dataset.recordId);
          navigate('detail', { selectedId: record.dataset.recordId, stage: selected?.stageGroup || state.stage, detailTab: 'overview', expandedCosts: false });
          return;
        }
        const screen = event.target.closest('[data-screen]');
        if (screen) {
          navigate(screen.dataset.screen);
          return;
        }
        const back = event.target.closest('[data-back]');
        if (back) navigate(back.dataset.back);
      });

      document.addEventListener('change', (event) => {
        if (event.target.matches('[data-period]')) {
          state.period = event.target.value;
          render();
        }
        if (event.target.matches('[data-health-filter]')) {
          state.healthFilter = event.target.value;
          render();
        }
      });

      document.addEventListener('input', (event) => {
        if (!event.target.matches('[data-search]')) return;
        const value = event.target.value;
        state.query = value;
        render();
        const input = document.querySelector('[data-search]');
        if (input) {
          input.focus();
          input.setSelectionRange(value.length, value.length);
        }
      });

      document.addEventListener('submit', (event) => {
        if (!event.target.matches('[data-preview-form]')) return;
        event.preventDefault();
        closeModal();
        showToast('Prototype entry recorded for this demo only. Nothing was permanently saved.');
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && state.modal) {
          closeModal();
          return;
        }
        if (event.key === 'Tab' && state.modal) {
          const focusable = [...modalRoot.querySelectorAll('button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])')];
          if (focusable.length) {
            const first = focusable[0];
            const last = focusable[focusable.length - 1];
            if (event.shiftKey && document.activeElement === first) {
              event.preventDefault();
              last.focus();
            } else if (!event.shiftKey && document.activeElement === last) {
              event.preventDefault();
              first.focus();
            }
          }
        }
        const row = event.target.closest('tr[data-record-id]');
        if (row && (event.key === 'Enter' || event.key === ' ')) {
          event.preventDefault();
          row.click();
        }
      });

      render();
    })();
  </script>
</body>
</html>
